<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление питомником</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f1;color:#1b3729;font:16px system-ui,sans-serif}main{max-width:850px;margin:30px auto;padding:16px}h1{font:35px Georgia}h2{font:26px Georgia}.card{background:white;border:1px solid #e2e9df;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 5px 18px #173b2610}input,select,textarea,button{font:inherit}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #b8cdbb;border-radius:10px;padding:12px;margin:5px 0 14px}textarea{min-height:100px}.btn{border:0;border-radius:10px;padding:12px 18px;background:#1d4c38;color:white;cursor:pointer;margin:3px}.secondary{background:#e8eee5;color:#1d4c38}.danger{background:#a63b42}.small{font-size:13px;color:#6c7a6f}.hidden{display:none}.plant{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid #e3e9e2;padding:14px 0}.plant img{height:75px;width:75px;object-fit:cover;border-radius:9px}.plantinfo{flex:1}.status{padding:10px;background:#e4f1e6;border-radius:9px;margin:10px 0}.error{background:#f9e4e1}label{font-weight:600}#preview{max-width:150px;max-height:110px;display:block;border-radius:10px;margin-bottom:12px}@media(max-width:600px){main{margin:0;padding:14px}.plant{flex-wrap:wrap}.plantinfo{min-width:55%}}</style></head><body><main><h1>🌿 Управление питомником</h1><p class="small">Каталог растений · Владивосток</p><div class="card" id="login"><h2>Вход для владельца</h2><label>Пароль<input type="password" id="password" autocomplete="current-password" placeholder="Пароль администратора"></label><button class="btn" id="enter">Войти</button></div><div id="panel" class="hidden"><button class="btn secondary" id="logout">Выйти</button><button class="btn" id="new">+ Добавить растение</button><div class="card"><h2>Растения в каталоге</h2><p class="small">Изменения сохраняются для всех посетителей сайта.</p><div id="list"></div></div><div class="card hidden" id="editor"><h2 id="formtitle">Добавить растение</h2><form id="form"><label>Название<input required minlength="2" maxlength="120" id="name"></label><label>Категория<select id="category"><option>Кустарники</option><option>Деревья</option><option>Многолетники</option><option>Хвойные</option><option>Другое</option></select></label><label>Цена, ₽<input required type="number" min="0" max="100000000" id="price" value="0"></label><label>Описание<textarea id="description" maxlength="3000"></textarea></label><label>Фото растения (JPEG, PNG или WEBP, до 550 КБ)<input type="file" id="photo" accept="image/jpeg,image/png,image/webp"></label><label>Или URL фотографии<input id="imageurl" placeholder="https://..."></label><img id="preview" alt=""><p><label><input type="checkbox" id="available" checked> В наличии</label></p><p><label><input type="checkbox" id="featured"> Новинка / выделить</label></p><button class="btn" type="submit">Сохранить</button><button class="btn secondary" type="button" id="cancel">Отмена</button></form></div></div><div id="msg" role="status"></div><p class="small">Совет: используйте собственные фотографии растений. Нажмите «Сохранить», чтобы опубликовать изменения.</p></main><script>
let data=[],editing=null,img='';const $=id=>document.getElementById(id),msg=(v,err=false)=>{$('msg').textContent=v;$('msg').className='status'+(err?' error':'')};async function api(url,method='GET',body){let r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');return j}
async function check(){try{let s=await api('/api/session');$('login').classList.toggle('hidden',s.authenticated);$('panel').classList.toggle('hidden',!s.authenticated);if(s.authenticated)await load()}catch(e){msg(e.message,true)}}async function load(){data=await api('/api/admin/plants');const root=$('list');root.replaceChildren();if(!data.length){root.textContent='Пока нет растений. Добавьте первое.';return}data.forEach(p=>{let d=document.createElement('div');d.className='plant';let im=document.createElement('img');if(p.image&&(/^(https:\/\/|data:image\/)/).test(p.image))im.src=p.image;im.alt=p.name;let inf=document.createElement('div');inf.className='plantinfo';inf.textContent=p.name+' · '+p.category+' · '+p.price+' ₽ · '+(p.available?'В наличии':'Нет в наличии');let edit=document.createElement('button');edit.className='btn secondary';edit.textContent='Изменить';edit.onclick=()=>show(p);let del=document.createElement('button');del.className='btn danger';del.textContent='Удалить';del.onclick=async()=>{if(!confirm('Удалить «'+p.name+'»?'))return;try{await api('/api/admin/plants/'+p.id,'DELETE');await load();msg('Удалено')}catch(e){msg(e.message,true)}};d.append(im,inf,edit,del);root.append(d)})}
function show(p){editing=p?.id??null;img=p?.image||'';$('formtitle').textContent=p?'Редактировать растение':'Новое растение';for(let k of ['name','category','price','description'])$(k).value=p?.[k]??(k==='price'?0:'');$('available').checked=p?.available!==false;$('featured').checked=p?.featured===true;$('imageurl').value=img.startsWith('https://')?img:'';$('photo').value='';$('preview').src=img;$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth'})}
$('enter').onclick=async()=>{try{await api('/api/login','POST',{password:$('password').value});$('password').value='';msg('Вход выполнен');await check()}catch(e){msg(e.message,true)}};$('logout').onclick=async()=>{await api('/api/logout','POST');await check()};$('new').onclick=()=>show(null);$('cancel').onclick=()=>$('editor').classList.add('hidden');
$('photo').onchange=async()=>{let f=$('photo').files[0];if(!f)return;if(f.size>550000){$('photo').value='';return msg('Размер файла больше 550 КБ. Сожмите фото.',true)}img=await new Promise((resolve,reject)=>{let rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)});$('imageurl').value='';$('preview').src=img};
$('imageurl').oninput=()=>{if($('imageurl').value.trim()){img=$('imageurl').value.trim();$('preview').src=img}};
$('form').onsubmit=async e=>{e.preventDefault();const p={name:$('name').value,category:$('category').value,price:Number($('price').value),description:$('description').value,image:img,available:$('available').checked,featured:$('featured').checked};try{await api(editing?'/api/admin/plants/'+editing:'/api/admin/plants',editing?'PUT':'POST',p);$('editor').classList.add('hidden');await load();msg('Растение сохранено')}catch(e){msg(e.message,true)}};check();
</script></body></html>
